name: Keep CodeMeet Awake

on:
  # Run once after workflow changes as well as on the regular schedule.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-alive.yml"
  # Render's free service can sleep after 15 minutes without traffic.
  # Run every 10 minutes to leave a buffer for GitHub schedule delays.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: codemeet-keep-alive
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping CodeMeet API (retry transient cold starts)
        env:
          HEALTH_URL: https://codemeet-adp3.onrender.com/api/health
        run: |
          set -eu
          for attempt in 1 2 3; do
            echo "Health check attempt ${attempt}/3"
            if curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 40 \
              -H "User-Agent: CodeMeet-KeepAlive/1.0" \
              "$HEALTH_URL"; then
              echo
              echo "CodeMeet API health check passed."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Health check failed; retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "CodeMeet API did not become healthy after 3 attempts."
          exit 1
